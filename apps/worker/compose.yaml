# Job worker. Merged after compose.yaml, wordpress/compose.yaml and
# apps/web/compose.yaml by scripts/appshelf.ps1; relative paths resolve from the
# repository root. Personal demo project: nothing restarts on its own.

x-worker-env: &worker-env
  # Same WordPress settings as the wordpress and wp-init services. The site
  # scripts get only these (plus PATH and HOME), never the worker's other
  # variables: see scriptEnv() in apps/worker/src/wp-scripts.ts.
  WORDPRESS_DB_HOST: mariadb:3306
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is not set; start the stack with scripts/appshelf.ps1}
  WP_DOMAIN: ${WP_DOMAIN:-wp.appshelf.localhost}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; start the stack with scripts/appshelf.ps1}

services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runtime
    image: appshelf-worker:local
    restart: "no"
    mem_limit: 384m
    # A running site script finishes before the worker exits (scripts take < 20 s).
    stop_grace_period: 60s
    environment:
      <<: *worker-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is not set; start the stack with scripts/appshelf.ps1}
    volumes:
      - wp_data:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      wp-init:
        condition: service_completed_successfully

  # Vitest inside the worker image against the running stack: queue tests plus the
  # handlers calling the real WordPress scripts. Uses its own database
  # (appshelf_worker_test), never the app database. Only runs on demand, through
  # the script so the secrets are passed to Compose:
  #   pwsh scripts/appshelf.ps1 dc --profile test run --rm --build worker-test
  worker-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: test
    image: appshelf-worker:test
    restart: "no"
    mem_limit: 768m
    environment:
      <<: *worker-env
      WP_INTERNAL_URL: http://wordpress
    command:
      - sh
      - -c
      - TEST_DATABASE_URL="postgres://appshelf:$${POSTGRES_PASSWORD}@postgres:5432/appshelf_worker_test" exec npm test -w @appshelf/worker
    volumes:
      - wp_data:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      wp-init:
        condition: service_completed_successfully
