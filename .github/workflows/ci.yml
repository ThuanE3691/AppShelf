name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: appshelf
          POSTGRES_PASSWORD: appshelf_test
          POSTGRES_DB: appshelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appshelf -d appshelf_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://appshelf:appshelf_test@localhost:5432/appshelf_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  infra:
    name: Shell, compose and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck wordpress scripts
        run: |
          # A git pathspec "*" also matches "/", so this covers every subfolder.
          mapfile -t scripts < <(git ls-files 'wordpress/*.sh')
          # -x follows the sourced lib.sh next to each script.
          docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:v0.11.0 \
            -x -P SCRIPTDIR -P wordpress/scripts "${scripts[@]}"
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: docker compose config
        run: |
          # Compose refuses missing env_file paths; CI has no secrets, so use empty files.
          touch .secrets.local .env.local
          base=(-f compose.yaml -f wordpress/compose.yaml -f apps/web/compose.yaml)
          if [ -f apps/worker/compose.yaml ]; then base+=(-f apps/worker/compose.yaml); fi
          # Every combination scripts/appshelf.ps1 can pass.
          for extra in "" "-f infra/images.compose.yaml" "-f infra/tunnel.compose.yaml" \
                       "-f infra/images.compose.yaml -f infra/tunnel.compose.yaml"; do
            echo "docker compose ${base[*]} $extra config -q"
            # shellcheck disable=SC2086 # $extra is intentionally split into flags.
            docker compose "${base[@]}" $extra config -q
          done

  images:
    name: Build images${{ github.event_name == 'push' && ' and publish' || '' }}
    needs: [node, infra]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Pick compose files and targets
        id: plan
        run: |
          touch .secrets.local .env.local
          files="compose.yaml wordpress/compose.yaml apps/web/compose.yaml"
          targets="web wordpress"
          if [ -f apps/worker/Dockerfile ] && [ -f apps/worker/compose.yaml ]; then
            files="$files apps/worker/compose.yaml"
            targets="$targets worker"
          else
            echo "::notice::apps/worker/Dockerfile not found yet; skipping the worker image."
          fi
          files="$files infra/images.compose.yaml infra/docker-bake.hcl"
          {
            echo "files<<EOF"; tr ' ' '\n' <<<"$files"; echo "EOF"
            echo "targets<<EOF"; tr ' ' '\n' <<<"$targets"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ github.event_name == 'push' && ' and push' || '' }}
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ steps.plan.outputs.files }}
          targets: ${{ steps.plan.outputs.targets }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          vars: |
            TAG=${{ github.sha }}
