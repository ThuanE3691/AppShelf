# WordPress Multisite services. Merged after the root compose.yaml
# (paths below are relative to the repository root).
# Personal demo project: nothing here restarts on its own.

services:
  wordpress:
    build:
      context: ./wordpress
    image: appshelf-wordpress:local
    restart: "no"
    mem_limit: 512m
    # Code from wp_data runs here, so it gets the WordPress DB password and nothing else.
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is not set; start the stack with scripts/appshelf.ps1}
      WP_DOMAIN: ${WP_DOMAIN:-wp.appshelf.localhost}
    volumes:
      - wp_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php && curl -fsS -o /dev/null http://127.0.0.1/wp-includes/images/blank.gif"]
      interval: 3s
      timeout: 3s
      retries: 40

  # One-shot, idempotent: network install, themes, mu-plugins, showcase sites.
  wp-init:
    build:
      context: ./wordpress
    image: appshelf-wordpress:local
    restart: "no"
    mem_limit: 256m
    command: ["/opt/appshelf/bin/wp-init.sh"]
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is not set; start the stack with scripts/appshelf.ps1}
      WP_NETWORK_ADMIN_PASSWORD: ${WP_NETWORK_ADMIN_PASSWORD:?WP_NETWORK_ADMIN_PASSWORD is not set; start the stack with scripts/appshelf.ps1}
      WP_DOMAIN: ${WP_DOMAIN:-wp.appshelf.localhost}
      WP_SCHEME: ${WP_SCHEME:-http}
    volumes:
      - wp_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      wordpress:
        condition: service_healthy
