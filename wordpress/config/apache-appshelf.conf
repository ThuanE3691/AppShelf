# AppShelf: quiet server banner, compression and long cache lifetimes for static assets.
ServerTokens Prod
ServerSignature Off

<IfModule mod_deflate.c>
	AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/javascript text/javascript application/json application/xml image/svg+xml
</IfModule>

<IfModule mod_expires.c>
	ExpiresActive On
	ExpiresByType image/svg+xml "access plus 1 year"
	ExpiresByType image/webp "access plus 1 year"
	ExpiresByType image/png "access plus 1 year"
	ExpiresByType image/jpeg "access plus 1 year"
	ExpiresByType image/x-icon "access plus 1 year"
	ExpiresByType text/css "access plus 1 year"
	ExpiresByType application/javascript "access plus 1 year"
	ExpiresByType text/javascript "access plus 1 year"
	ExpiresByType font/woff2 "access plus 1 year"
</IfModule>

<IfModule mod_headers.c>
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Template content files are read by the site scripts only.
<DirectoryMatch "^/var/www/html/wp-content/themes/appshelf-[a-z]+/content">
	Require all denied
</DirectoryMatch>
